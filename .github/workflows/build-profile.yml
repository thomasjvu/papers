name: Optional viewer build profile

on:
  pull_request:
    paths:
      - 'vite.config.ts'
      - 'scripts/build-vite.mjs'
      - 'scripts/lib/viteBundleCache.mjs'
      - 'scripts/release-smoke.mjs'
      - 'scripts/preview-smoke.mjs'
      - 'scripts/lib/routePreloads.mjs'
      - '.github/workflows/build-profile.yml'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        viewer: [enabled, disabled]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configure disabled OpenAPI fixture
        if: matrix.viewer == 'disabled'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const configFile = 'shared/documentation-config.js';
          const text = readFileSync(configFile, 'utf8');
          const updated = text.replace(/(export const openapiConfig = \{\s*enabled:) true/, '$1 false');
          if (updated === text) throw new Error('Could not disable OpenAPI');
          writeFileSync(configFile, updated);
          NODE
          npm run generate:openapi
          npm run generate:llms
          npm run generate:docs
          npm run generate:seo -- --mode production
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          HUSKY=0 git commit --no-verify -m 'chore: disable OpenAPI for profile fixture'
      - name: Cold build and capture per-phase timings and peak memory
        run: |
          export PROFILE_DIR="${{ runner.temp }}/build-profile"
          mkdir -p "$PROFILE_DIR"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const profileDir = process.env.PROFILE_DIR;
          const phases = [
            ['resolve:theme', ['npm', 'run', 'resolve:theme']],
            ['generate:icons', ['npm', 'run', 'generate:icons']],
            ['generate:design-book', ['npm', 'run', 'generate:design-book']],
            ['generate:openapi', ['npm', 'run', 'generate:openapi']],
            ['generate:llms', ['npm', 'run', 'generate:llms']],
            ['generate:docs', ['npm', 'run', 'generate:docs']],
            ['generate:seo', ['npm', 'run', 'generate:seo', '--', '--mode', 'production']],
            ['tsc', ['npx', 'tsc', '-b']],
            ['vite', ['node', '--max-old-space-size=4096', 'scripts/build-vite.mjs']],
            ['generate:route-html', ['npm', 'run', 'generate:route-html', '--', '--mode', 'production']],
            ['generate:pagefind', ['npm', 'run', 'generate:pagefind']],
            ['generate:last-updated', ['npm', 'run', 'generate:last-updated']],
            ['generate:rss', ['npm', 'run', 'generate:rss']],
            ['write:build-manifest', ['npm', 'run', 'write:build-manifest']],
          ];

          const results = [];
          const logs = [];
          const totalStart = process.hrtime.bigint();

          for (const [name, [cmd, ...args]] of phases) {
            const timeFile = join(profileDir, `cold-${name.replace(/[^a-z0-9-]/gi, '_')}.time`);
            const start = process.hrtime.bigint();
            const out = execFileSync('/usr/bin/time', ['-v', '-o', timeFile, cmd, ...args], {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'pipe'],
            });
            const ms = Math.round(Number(process.hrtime.bigint() - start) / 1e6);
            results.push({ name, ms, status: 'ok' });
            logs.push(`=== ${name} (${ms}ms) ===\n${out}`);
          }

          const totalMs = Math.round(Number(process.hrtime.bigint() - totalStart) / 1e6);
          writeFileSync(join(profileDir, 'cold-phases.json'), JSON.stringify({ totalMs, results }, null, 2) + '\n');
          writeFileSync(join(profileDir, 'cold-build.log'), logs.join('\n'));
          console.log(JSON.stringify({ totalMs, results }, null, 2));
          NODE
          du -sk dist > "$PROFILE_DIR/dist-size.txt"
          find dist -type f | wc -l > "$PROFILE_DIR/file-count.txt"
          cp dist/bundle-budget.json "$PROFILE_DIR/bundle-budget.json"
          grep -E 'modules transformed|built in' "$PROFILE_DIR/cold-build.log" || true
          grep -E 'Maximum resident set size|Elapsed|User time' "$PROFILE_DIR/cold-vite.time" || true
      - name: Validate cold build artifacts and routes
        run: npm run release:check:papers
      - name: Verify content-only warm rebuild cache hit and output parity
        run: |
          export PROFILE_DIR="${{ runner.temp }}/build-profile"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const profileDir = process.env.PROFILE_DIR;

          function hashViteOutputs() {
            const map = {};
            const assetsDir = join('dist', 'assets');
            for (const name of readdirSync(assetsDir).sort()) {
              const p = join(assetsDir, name);
              map[`assets/${name}`] = createHash('sha256').update(readFileSync(p)).digest('hex');
            }
            map['bundle-budget.json'] = createHash('sha256')
              .update(readFileSync(join('dist', 'bundle-budget.json')))
              .digest('hex');
            return map;
          }

          const coldHashes = hashViteOutputs();

          appendFileSync(
            'src/docs/content/getting-started/introduction.md',
            '\nContent-only rebuild parity check.\n'
          );

          const start = process.hrtime.bigint();
          const out = execFileSync(
            '/usr/bin/time',
            ['-v', '-o', join(profileDir, 'warm-build.time'), 'npm', 'run', 'build'],
            { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }
          );
          const warmTotalMs = Math.round(Number(process.hrtime.bigint() - start) / 1e6);
          writeFileSync(join(profileDir, 'warm-build.log'), out);

          assert.match(
            out,
            /Reused cached Vite app bundle/,
            'Expected content-only rebuild to reuse the cached Vite app bundle.'
          );

          const updatedDoc = readFileSync('dist/docs-content/getting-started/introduction.json', 'utf8');
          assert.match(
            updatedDoc,
            /Content-only rebuild parity check\./,
            'Expected updated markdown content to propagate into dist/.'
          );

          const warmHashes = hashViteOutputs();
          assert.deepEqual(
            warmHashes,
            coldHashes,
            'Cached Vite bundle outputs drifted from the cold build.'
          );

          const summary = {
            warmTotalMs,
            verifiedViteFiles: Object.keys(warmHashes).length,
            cacheHit: true,
          };
          writeFileSync(join(profileDir, 'warm-summary.json'), JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          HUSKY=0 git commit --no-verify -m 'chore: commit content-only warm rebuild fixture'
          npm run write:build-manifest
          npm run release:artifact-check
          npm run release:preview-check
      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-profile-${{ matrix.viewer }}
          path: ${{ runner.temp }}/build-profile/
          if-no-files-found: warn
