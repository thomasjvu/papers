name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: ${{ vars.PAPERS_DEPLOY_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run type checking
        run: npm run type-check

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SITE_URL: ${{ vars.PAPERS_DEPLOY_HOST }}

      - name: Run release smoke checks
        run: npm run release:check:papers

      - name: Run runtime security audit
        run: npm run check:runtime-audit

      - name: Check asset ownership and budgets
        run: npm run check:assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download validated production build
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse gate
        run: npm run lighthouse:check

      - name: Upload private Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npx playwright test
