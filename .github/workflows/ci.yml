name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: ${{ vars.PAPERS_DEPLOY_HOST }}

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run type checking
        run: npm run type-check

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SITE_URL: ${{ vars.PAPERS_DEPLOY_HOST }}

      - name: Run release smoke checks
        if: matrix.node-version == 24
        run: npm run release:check

      - name: Run runtime security audit
        if: matrix.node-version == 24
        run: npm run check:runtime-audit

      - name: Check asset ownership and budgets
        if: matrix.node-version == 24
        run: npm run check:assets

      - name: Upload build artifacts
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: build-output-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download validated production build
        uses: actions/download-artifact@v4
        with:
          name: build-output-node-24
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse gate
        run: npm run lighthouse:check

      - name: Upload private Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: build-output-node-24
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npx playwright test

      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results
          if-no-files-found: warn
