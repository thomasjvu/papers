name: Release create-papers

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-papers-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run framework tests
        run: npm test

      - name: Run lint and type checks
        run: |
          npm run lint
          npm run format:check
          npm run type-check

      - name: Build framework
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run release and package checks
        run: npm run release:check

      - name: Run packed clean-consumer smoke
        run: npm run create:smoke

  publish:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js for npm provenance
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install package tooling
        run: npm ci

      - name: Verify tag matches both package versions
        run: |
          VERSION=$(node -p "require('./packages/create-papers/package.json').version")
          ROOT_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$ROOT_VERSION" = "$VERSION"

      # npm publishing is optional: without an NPM_TOKEN secret the release is
      # still a Git tag plus GitHub release, which is what sites upgrade from.
      - name: Publish create-papers with provenance
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --prefix packages/create-papers --provenance --access public

      - name: Probe exact public package version
        id: package
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          VERSION=$(node -p "require('./packages/create-papers/package.json').version")
          PUBLISHED_VERSION=$(npm view "create-papers@$VERSION" version)
          test "$PUBLISHED_VERSION" = "$VERSION"
          TARBALL_URL=$(npm view "create-papers@$VERSION" dist.tarball)
          test -n "$TARBALL_URL"
          echo "tarball=$TARBALL_URL" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE=$(mktemp)
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > "$NOTES_FILE"
          printf '\nSites upgrade with `node scripts/papers-upgrade.mjs --to %s`.\n' "$GITHUB_REF_NAME" >> "$NOTES_FILE"
          if [ -n "$PACKAGE_TARBALL" ]; then
            printf '\ncreate-papers@%s was published with npm provenance: %s\n' "$VERSION" "$PACKAGE_TARBALL" >> "$NOTES_FILE"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE" --verify-tag
          fi
