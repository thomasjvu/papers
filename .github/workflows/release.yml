name: Release

# How a Papers release happens (see RELEASING.md):
# 1. release-please keeps a "chore(release): vX.Y.Z" pull request open that
#    bumps both package versions and writes CHANGELOG.md from the
#    conventional commits merged to main.
# 2. Merging that pull request tags vX.Y.Z and creates the GitHub release.
# 3. The same run validates the tag and publishes @thomasjvu/papers and
#    create-papers to npm with provenance via npm trusted publishing (GitHub
#    OIDC). No npm token is stored in this repository.
# Re-run a publish for an existing tag with "Run workflow" and the tag name.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to validate and publish (e.g. v0.2.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: papers-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Open or update the release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validate:
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run framework tests
        run: npm test

      - name: Run lint and type checks
        run: |
          npm run lint
          npm run format:check
          npm run type-check

      - name: Build framework
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run release and package checks
        run: npm run release:check:papers
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}

      - name: Run packed clean-consumer smoke
        run: npm run create:smoke

  publish:
    needs: validate
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches both package versions
        run: |
          VERSION=$(node -p "require('./packages/create-papers/package.json').version")
          ROOT_VERSION=$(node -p "require('./package.json').version")
          test "$TAG" = "v$VERSION"
          test "$ROOT_VERSION" = "$VERSION"

      - name: Publish to npm with provenance (trusted publishing)
        run: |
          VERSION="${TAG#v}"
          publish() {
            if npm view "$1@$VERSION" version >/dev/null 2>&1; then
              echo "$1@$VERSION is already on npm"
            else
              npm publish "$2" --provenance --access public
            fi
          }
          publish @thomasjvu/papers .
          publish create-papers ./packages/create-papers

      - name: Ensure the GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            VERSION="${TAG#v}"
            NOTES_FILE=$(mktemp)
            awk -v v="$VERSION" '$0 ~ "^## \\[?"v"[] ]" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > "$NOTES_FILE"
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --verify-tag
          fi
